twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/tailwind_theme.html.twig']
    globals:
        # Categorical chart colours in fixed order (brand-600 first), checked
        # with the dataviz skill's validator on a light surface. Three sit
        # under 3:1 contrast, so every chart using them prints its labels.
        chart_palette: ['#0085a6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948']

when@test:
    twig:
        strict_variables: true
