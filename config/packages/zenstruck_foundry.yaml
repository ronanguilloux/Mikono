when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true
        orm:
            # Rebuild by replaying migrations, not with the schema tool. The
            # default `schema` mode runs `doctrine:schema:drop --full-database`,
            # and that flag takes the unmapped `doctrine_migration_versions`
            # table with it — after which the entrypoint's
            # `migrate --all-or-nothing` sees zero applied versions, replays
            # migration 1 onto a live schema, and restart-loops the container.
            # That cost four hand-repairs before this line existed; don't set
            # it back to `schema`. See done.md, 2026-09-06.
            reset:
                mode: migrate

    # If you use the `make:factory --test` command, you may need to uncomment the following.
    # See https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#generate
    #services:
    #    App\Tests\Factory\:
    #        resource: '%kernel.project_dir%/tests/Factory/'
    #        autowire: true
    #        autoconfigure: true

when@test: *dev
