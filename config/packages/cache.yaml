framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

when@test:
    framework:
        cache:
            pools:
                # Login throttling (security.yaml) counts failed attempts in
                # cache.rate_limiter, which the framework defines as a child of
                # cache.app — files under var/cache/test/pools, keyed stably by
                # username + IP, that no test resets. The limiter is peekable,
                # so a successful login never clears them and only failures
                # count: SecurityControllerTest's wrong-password case added one
                # token per suite run, and the fifth run inside the 15-minute
                # window locked out its own correct-credentials case.
                #
                # An in-memory pool ends that: nothing survives the process.
                # Overriding the name works because FrameworkExtension registers
                # cache pools *after* the rate limiter's own definition and ends
                # with setDefinition(), so this replaces it.
                #
                # Side effect worth knowing before writing a test against
                # throttling: it makes throttling inert here. Every cache pool
                # is tagged kernel.reset and ArrayAdapter::reset() clears the
                # array, so the services resetter empties the counters at each
                # request boundary of the test client — $client->disableReboot()
                # does not prevent it. Failed logins therefore never accumulate
                # in the test environment. Throttling itself is unchanged in
                # dev and prod.
                cache.rate_limiter:
                    adapter: cache.adapter.array
