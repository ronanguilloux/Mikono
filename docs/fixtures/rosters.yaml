# UCESCO roster archive — the fixture dataset.
#
# Transcribed by hand from the volunteers' WhatsApp group (03/08/2026 →
# 03/09/2026), where the Volunteer Manager posts each afternoon the schedule
# for the following day. The raw export stays out of git; see README.md in
# this directory for the transcription rules and ADR 0012 for why fixtures
# come from here rather than from a generator.
#
# Every date below is the day the roster COVERS. `posted` is the day the
# message announcing it was sent.

volunteers:
  - name: Ellen
    active: false
  - name: Ronan
    active: false
  - name: Charline
    active: false
  - name: Gwen
    active: false
  - name: Daphne
    active: true
  - name: Tina
    active: false
    # 28/08: "I will miss all of you so much! Can't wait to be back in February"
    notes: Finished her stint on 28/08/2026; said she would be back in February.
  - name: Annabelle
    active: false
  - name: Leni
    active: false
  - name: Marco
    active: true
  - name: Cyrine
    active: false
  - name: Rahel
    active: true
  - name: Lana
    active: true
  - name: Chloe
    active: true
  # Recorded as the rosters spell them. "Hellen" (September) may or may not be
  # the "Ellen" of early August — the archive does not say, so they are not
  # merged.
  - name: Hellen
    active: true
  - name: Hannah
    active: true

escorts:
  - Mr Maeba
  - Sam
  - Hassan
  - Ofright
  - Edna

# Branch and ownership are not in the roster messages; they come from the
# project records already established with the VM (docs/brainstorm/04).
# Sites outside the Nairobi base carry the region in their name.
projects:
  - key: peggy_lucas
    name: Peggy Lucas school
    branch: Nairobi (HQ)
    ownership: ucesco
    activity_type: School support
  - key: bright_achievers
    name: Bright Achievers school
    branch: Nairobi (HQ)
    ownership: partner
    partner: Bright Achievers High School
    activity_type: School support
  - key: ack_clinic
    name: ACK clinic
    branch: Nairobi (HQ)
    ownership: partner
    partner: Anglican Church of Kenya (ACK)
    activity_type: Clinic support
  - key: beyond_zero
    name: Beyond Zero clinic
    branch: Nairobi (HQ)
    ownership: partner
    partner: Beyond Zero
    activity_type: Clinic support
  - key: toi_field
    name: Toi School Field
    branch: Nairobi (HQ)
    ownership: partner
    partner: Toi School
    activity_type: Sports
  - key: dreams_of_hope
    name: Dreams of Hope Kids
    branch: Nairobi (HQ)
    ownership: partner
    partner: Dreams of Hope
    activity_type: Orphanage support
  - key: mveti
    name: MVETI
    branch: Nairobi (HQ)
    ownership: partner
    partner: MVETI
    activity_type: Vocational training support
  # The five sites below sit in Mombasa, and `branch` is where that is
  # recorded — the name never repeats it (ADR 0012). The messages qualify
  # them the same way, in parentheses: "Minto children Orphanage (Mombasa)".
  - key: mt_hermon
    name: Mt Hermon school
    branch: Mombasa
    ownership: partner
    partner: Mt Hermon School
    activity_type: School support
    # Placed in Mombasa because Ofright escorts it, and Ofright works only the
    # Mombasa sites in this archive. The messages never say so outright.
  - key: minto
    name: Minto Children's Orphanage
    branch: Mombasa
    ownership: partner
    partner: Minto Children's Orphanage
    activity_type: Orphanage support
  - key: mtwapa_beach
    name: Mtwapa Beach
    branch: Mombasa
    ownership: ucesco
    activity_type: Beach clean-up
  - key: mombasa_office
    # "Mombasa Office assisting in Communication" in the messages; the region
    # is the `branch`, so the site itself is the office.
    name: Office
    branch: Mombasa
    ownership: ucesco
    activity_type: Office/admin support
  - key: mombasa_home_visits
    # "Home Visit (Mombasa)" in the messages.
    name: Home visits
    branch: Mombasa
    ownership: ucesco
    activity_type: Home visit
  # No roster line in this archive sends anyone to HQ, but it is a real site
  # and orientation happens there — every new volunteer's first half-day.
  - key: ucesco_hq
    name: UCESCO HQ
    branch: Nairobi (HQ)
    ownership: ucesco
    activity_type: Orientation
  # The two hubs below exist for the Volunteer World listing's programs, not
  # for any roster: no roster sends anyone to Samburu or Uganda, so they have
  # no activity_type. Each is named after its branch's physical location, as
  # the branch migration records it (ADR 0025), never after the region.
  - key: samburu_hub
    name: Ichingei Village
    branch: Samburu
    ownership: ucesco
  - key: uganda_hub
    name: Ggaba
    branch: Uganda
    ownership: ucesco

# UCESCO's programs, from its public Volunteer World listing — the second
# source this archive admits (ADR 0012; rules in README.md). Fetched
# 2026-09-24 from
# https://www.volunteerworld.com/en/filter?ProjectId=71f31166-6a8c-45fb-acb5-cccd69a2a98e
# — 40 programs, each read from its own page.
#
# The listing places a program in a city, never at a site, so each one sits
# on its branch's hub project: `ucesco_hq` for Nairobi, `mombasa_office` for
# Mombasa, `samburu_hub` for Maralal, `uganda_hub` for Kampala. `name` is the
# listing's title; `suggested_roles` condenses the tasks its page lists. No
# program has dates: the listing's "1–50 weeks" is how long a volunteer may
# stay, not when the program runs.
programs:
  # Named by Ronan as the first real program (docs/brainstorm/10), not taken
  # from the listing — the one program tied to an archive site.
  - name: Computer Tuition
    project: peggy_lucas
    activity_types: [Computer tuition]

  # --- Nairobi ---
  - name: Teaching and School Support Assistant
    project: ucesco_hq
    activity_types: [School support]
    suggested_roles: Classroom assistant, small-group tutor in reading, writing and numeracy, break-time supervisor
  - name: Childcare & Early Childhood Development Assistant
    project: ucesco_hq
    activity_types: [Childcare]
    suggested_roles: Early-childhood classroom assistant, daycare helper, storytelling and play leader
  # The listing cuts this title off at "Training Assista"; only the last word
  # is completed.
  - name: ICT, Web Design & Computer Skills Training Assistant
    project: ucesco_hq
    activity_types: [Computer tuition]
    suggested_roles: Computer skills tutor, web design mentor, digital literacy and internet safety trainer
  - name: Chinese Teacher in our Local Schools
    project: ucesco_hq
    activity_types: [Language tuition]
    suggested_roles: Mandarin teacher, lesson-plan and materials assistant, conversation practice lead
  # The listing spells it "assitant".
  - name: French Language Assistant Tutor (Francophone)
    project: ucesco_hq
    activity_types: [Language tuition]
    suggested_roles: French tutor for youth and community learners
  # The listing spells it "Assitant".
  - name: Italian Language Teacher Assistant
    project: ucesco_hq
    activity_types: [Language tuition]
    suggested_roles: Italian teacher for children aged 4–14, language activity assistant
  - name: Life Skills Speaker & Counselor
    project: ucesco_hq
    activity_types: [Counselling]
    suggested_roles: Guest speaker on health, budgeting, CV writing, interviews, time management or conflict resolution
  - name: Mental Health & Psychosocial Support
    project: ucesco_hq
    activity_types: [Counselling]
    suggested_roles: Counsellor (addiction, grief, career), psychotherapist, special-needs daycare helper
  - name: Local Medical & Clinical Experience
    project: ucesco_hq
    activity_types: [Clinic support, Health outreach]
    suggested_roles: Medical camp volunteer, clinic assistant, hospital shadow, medical or nursing elective student
  - name: Dental Outreach & Oral Health Education
    project: ucesco_hq
    activity_types: [Clinic support, Health outreach]
    suggested_roles: Dental screening assistant, assistant dentist (professionals), oral hygiene educator
  - name: Cook and Nutritionist Assistant
    project: ucesco_hq
    activity_types: [Cooking & nutrition]
  - name: Community Service Supporter
    project: ucesco_hq
    activity_types: [Community service]
    suggested_roles: Donation drive organiser, school walk-home escort, community event helper, gardening volunteer
  - name: Giving Support to Vulnerable Communities
    project: ucesco_hq
    activity_types: [Community service]
    suggested_roles: Donation sorter, outreach event helper, grounds clean-up and landscaping volunteer
  - name: EcoAction & Environmental Conservation Assistant
    project: ucesco_hq
    activity_types: [Environmental conservation]
    suggested_roles: Tree planter, school garden builder, clean-up lead, environmental educator
  - name: School Renovation and Construction Assistant
    project: ucesco_hq
    activity_types: [Construction & renovation]
    suggested_roles: Construction helper (walls, roofs, floors, tiling), painter, furniture repairer
  - name: Painting & Remodeling Assistance
    project: ucesco_hq
    activity_types: [Construction & renovation]
    suggested_roles: Painter, muralist, interior decoration assistant
  - name: Women Empowerment through Micro-Finance
    project: ucesco_hq
    activity_types: [Women's empowerment]
    suggested_roles: Financial literacy trainer, savings group supporter, small business mentor
  - name: Local Women Empowerment Assistance
    project: ucesco_hq
    activity_types: [Women's empowerment, Vocational training support]
    suggested_roles: Nail art and beauty trainer
  - name: Creative Arts and Culture Assistant
    project: ucesco_hq
    activity_types: [Creative arts]
    suggested_roles: Music teacher, art and craft workshop lead, dance session lead, cultural event organiser
  - name: Sports & Recreation Coaching Assistant
    project: ucesco_hq
    activity_types: [Sports]
    suggested_roles: Football, volleyball or athletics coach, tournament organiser
  - name: NGO Management, Media & Administration Assistant
    project: ucesco_hq
    activity_types: [Office/admin support, Media & communications]
    suggested_roles: Office administrator, data and reporting assistant, content creator, fundraising and events assistant

  # --- Mombasa ---
