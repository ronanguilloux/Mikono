---
services:
  php:
    restart: unless-stopped
    # Docker's built-in tini as PID 1, so orphaned child processes (e.g.
    # Chromium subprocesses left behind by Panther/chromedriver, see
    # docs/adr/0007-adopt-panther-for-adhoc-visual-verification.md) get
    # reaped instead of accumulating as zombies.
    init: true
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      # SQLite: one file, no separate database service needed.
      # See docs/adr/0003-adopt-docker-frankenphp-symfony-sqlite-tailwind-for-volunteer-manager.md
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data/data_%kernel.environment%.db
      # Caddy's access log as a rolling JSON file instead of console-format
      # stderr. FrankenPHP *is* Caddy — same container, same process — so
      # /usage reads this file directly, with no sidecar and no log shipper.
      # See ADR 0021.
      #
      # frankenphp/Caddyfile already has `log { {$CADDY_SERVER_LOG_OPTIONS} }`
      # and nothing defined this until now, which is why Caddy fell back to
      # stderr. Set here rather than in the Caddyfile because that file is
      # COPY'd into the image: an env var ships with a `git pull`, a Caddyfile
      # edit would need a CI image rebuild to reach production.
      #
      # roll_size/roll_keep are explicit because Caddy's defaults are
      # 100 MiB x 10 — 1 GB, on a 2 GB VPS.
      CADDY_SERVER_LOG_OPTIONS: |
        output file /app/var/log/access.log {
          roll_size 10MiB
          roll_keep 3
        }
        format json
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Named volume for the SQLite file and the session files — survives
      # `down`/`up`/rebuild and, more to the point, a redeploy,
      # unlike the anonymous volume compose.override.yaml uses to exclude the
      # rest of var/ (cache/log) from the dev bind-mount for performance.
      - db_data:/app/var/data
      # The access log behind /usage, kept out of db_data on purpose: that
      # volume is what backup-db.sh snapshots and what a restore drill
      # replaces, and request logs have no business riding along. Not backed
      # up — losing this loses usage history, not data.
      - log_data:/app/var/log
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

volumes:
  caddy_data:
  caddy_config:
  db_data:
  log_data:
