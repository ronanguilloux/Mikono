expose_php = 0
; Every user of this app is in Kenya (EAT, UTC+3), and the home screen's
; "Today's roster"/"Tomorrow's roster" resolve `new \DateTimeImmutable('today')`
; against this setting — under UTC they showed the previous day's roster
; between 00:00 and 03:00 local time. PHP bundles its own timezone database,
; so the slim production image needs no tzdata package for this.
date.timezone = Africa/Nairobi
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
