; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; 10-app.ini sets opcache.enable_file_override=1 (a prod optimization that
; caches filemtime()/file_exists() results for the life of the process).
; Under FrankenPHP's persistent worker mode this silently hides edits to
; PHP/Twig files from the dev bind-mount until the worker restarts, which
; defeats the point of live-editing in dev. Off here; still on in prod
; (20-app.prod.ini), where source doesn't change at runtime anyway.
opcache.enable_file_override = 0
opcache.revalidate_freq = 0
